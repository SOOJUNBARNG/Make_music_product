[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicgen-cpu"
version = "0.1.0"
description = "CPU で動く MusicGen (text-to-music) 生成基盤"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
musicgen-cpu = "musicgen_cpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
